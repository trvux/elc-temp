name: Deploy to VPS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/bun.lock') }}-${{ hashFiles('**/*.js', '**/*.jsx', '**/*.ts', '**/*.tsx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/bun.lock') }}-

      - name: Build project
        run: bun run build
        env:
          NEXT_PUBLIC_HOTJAR_ID: ${{ secrets.NEXT_PUBLIC_HOTJAR_ID }}
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${{ secrets.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          # Can thiet vi cac trang public duoc prerender tinh (static) luc build,
          # nen can goi duoc Go API ngay trong buoc build nay.
          GO_API_URL: ${{ secrets.GO_API_URL }}

      - name: Prepare standalone files
        run: |
          cp -r public .next/standalone/
          cp -r .next/static .next/standalone/.next/

      - name: Deploy to VPS via Rsync
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          # App khong con dung "use cache"/ISR nua (moi trang la force-dynamic) nen
          # .next/cache khong con chua data that -- exclude nay chi con y nghia
          # giu build-cache cua Next.js tren VPS, khong anh huong tinh dung dan.
          rsync -az --delete --exclude='.next/cache' -e "ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no" .next/standalone/ ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/var/www/elc-tem/

      - name: Restart PM2 on VPS
        uses: appleboy/ssh-action@v1.0.3
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: GOOGLE_SERVICE_ACCOUNT_JSON
          script: |
            cd /var/www/elc-tem
            # Ghi runtime env vars vao ecosystem.config.js (nam trong thu muc project)
            # instances:2 + exec_mode:cluster la dieu kien de "pm2 reload" dat duoc
            # zero-downtime that su -- PM2 khoi dong worker moi, cho no listen xong
            # roi moi tat worker cu, luon co it nhat 1 worker phuc vu request. Ca 2
            # worker dung chung .next/cache tren dia (Next.js build-cache, khong
            # phai data cache -- app da force-dynamic toan bo, khong con ISR/data cache).
            python3 -c 'import os,json; cfg={"apps":[{"name":"elc-tem","script":"server.js","instances":2,"exec_mode":"cluster","listen_timeout":10000,"kill_timeout":5000,"env":{"PORT":"3000","NODE_ENV":"production","GOOGLE_SERVICE_ACCOUNT_JSON":os.environ.get("GOOGLE_SERVICE_ACCOUNT_JSON",""),"GO_API_URL":"http://localhost:8090"}}]}; open("ecosystem.config.js","w").write("module.exports = "+json.dumps(cfg)+";\n")'
            # Doi Go API san sang truoc khi start Next.js (chi can thiet cho lan
            # deploy dau tien / VPS moi khoi dong lai tu dau, khi chua co PM2 process
            # nao dang chay ca)
            echo "Waiting for Go API to be ready..."
            for i in $(seq 1 30); do
              if curl -sf http://localhost:8090/brands > /dev/null 2>&1; then
                echo "Go API is ready after ${i}x2s"
                break
              fi
              echo "  attempt $i/30..."
              sleep 2
            done
            # Deploy dau tien (chua co process) thi start; cac lan sau dung reload
            # de rolling-restart tung worker mot -- khong bao gio ca 2 worker cung
            # down cung luc (zero-downtime that su, khong chi la restart nhanh).
            # Rieng lan chuyen tu fork-mode (cu) sang cluster-mode (moi) thi reload
            # co the khong ap dung duoc thay doi exec_mode -- fallback delete+start
            # cho DUY NHAT lan chuyen doi nay, cac lan sau se luon reload duoc.
            if pm2 describe elc-tem > /dev/null 2>&1; then
              pm2 reload ecosystem.config.js --update-env || (pm2 delete elc-tem && pm2 start ecosystem.config.js)
            else
              pm2 start ecosystem.config.js
            fi
            pm2 save

