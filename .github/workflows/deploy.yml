name: Deploy to VPS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/pnpm-lock.yaml') }}-${{ hashFiles('**/*.js', '**/*.jsx', '**/*.ts', '**/*.tsx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/pnpm-lock.yaml') }}-

      - name: Build project
        run: pnpm build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_HOTJAR_ID: ${{ secrets.NEXT_PUBLIC_HOTJAR_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          # Can thiet de "use cache" fetch duoc data tu Go API trong luc build
          GO_API_URL: ${{ secrets.GO_API_URL }}

      - name: Prepare standalone files
        run: |
          cp -r public .next/standalone/
          cp -r .next/static .next/standalone/.next/

      - name: Deploy to VPS via Rsync
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          rsync -az --delete -e "ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no" .next/standalone/ ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/var/www/elc-tem/

      - name: Restart PM2 on VPS
        uses: appleboy/ssh-action@v1.0.3
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: GOOGLE_SERVICE_ACCOUNT_JSON,CLOUDFLARE_ZONE_ID,CLOUDFLARE_API_TOKEN
          script: |
            cd /var/www/elc-tem
            # Ghi runtime env vars vao ecosystem.config.js (nam trong thu muc project)
            python3 -c 'import os,json; cfg={"apps":[{"name":"elc-tem","script":"server.js","env":{"PORT":"3000","NODE_ENV":"production","GOOGLE_SERVICE_ACCOUNT_JSON":os.environ.get("GOOGLE_SERVICE_ACCOUNT_JSON",""),"GO_API_URL":"http://localhost:8090","CLOUDFLARE_ZONE_ID":os.environ.get("CLOUDFLARE_ZONE_ID",""),"CLOUDFLARE_API_TOKEN":os.environ.get("CLOUDFLARE_API_TOKEN","")}}]}; open("ecosystem.config.js","w").write("module.exports = "+json.dumps(cfg)+";\n")'
            # Xoa cache cu cua Next.js (Full Route Cache / Data Cache) de tranh ket cache
            rm -rf .next/cache
            # Doi Go API san sang truoc khi start Next.js
            # Tranh race condition: Next.js start truoc Go -> cache rong bi giu lai
            echo "Waiting for Go API to be ready..."
            for i in $(seq 1 30); do
              if curl -sf http://localhost:8090/brands > /dev/null 2>&1; then
                echo "Go API is ready after ${i}x2s"
                break
              fi
              echo "  attempt $i/30..."
              sleep 2
            done
            # Tao hoac cap nhat PM2 process
            pm2 delete elc-tem 2>/dev/null || true
            pm2 start ecosystem.config.js

