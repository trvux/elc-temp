# URL normalization helper: $uri without trailing slash(es). "/" stays "/".
# Canonical form of the site: https://dienmayelc.com.vn/path  (apex, https, no trailing slash).
map $uri $elc_noslash {
    default $uri;
    "~^(?<p>.+?)/+$" $p;
}

# Slugs are all lowercase, but nginx map exact-match is case-insensitive, so /SAN-PHAM/x would slip
# through the allowlist and hit Next. Flag any first segment (or content-prefixed path) with an
# uppercase letter. First match wins: the Zalo verifier file legitimately has capitals.
map $uri $elc_upper {
    default 0;
    "~^/zalo_verifier" 0;
    "~^/[^/]*[A-Z]" 1;
    "~^/(san-pham|tin-tuc|du-an|dich-vu|thong-tin)/.*[A-Z]" 1;
}
