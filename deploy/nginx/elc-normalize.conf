# URL normalization helper: $uri without trailing slash(es). "/" stays "/".
# Canonical form of the site: https://dienmayelc.com.vn/path  (apex, https, no trailing slash).
map $uri $elc_noslash {
    default $uri;
    "~^(?<p>.+?)/+$" $p;
}

# Slugs are all lowercase, but nginx map exact-match is case-insensitive, so /SAN-PHAM/x would slip
# through the allowlist and hit Next. Flag any first segment (or content-prefixed path) with an
# uppercase letter. First match wins: the Zalo verifier file legitimately has capitals.
map $uri $elc_upper {
    default 0;
    "~^/zalo_verifier" 0;
    "~^/[^/]*[A-Z]" 1;
    "~^/(san-pham|tin-tuc|du-an|dich-vu|thong-tin)/.*[A-Z]" 1;
}

# Markdown negotiation for dead URLs (AI agents): 1 when the client lists text/markdown and did not
# refuse it with q=0. Dead paths for such clients are rewritten to Next's DB-free /agent-md/gone
# (410 + Markdown body + Vary: Accept) instead of nginx's bare HTML 410. Browsers never send it.
map $http_accept $elc_wants_md {
    default 0;
    "~*text/markdown[[:space:]]*;[[:space:]]*q=0(\.0*)?[[:space:]]*(,|$)" 0;
    "~*text/markdown" 1;
}

# Dead = not in the allowlist ($elc_live=0) or uppercase slug ($elc_upper=1).
map "$elc_live:$elc_upper:$elc_wants_md" $elc_gone_md {
    default 0;
    "~^0:[01]:1$" 1;
    "~^1:1:1$" 1;
}
